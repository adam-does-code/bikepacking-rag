[tool.poetry]
name = "bikepacking-rag"
version = "0.1.0"
description = "A learning-focused RAG pipeline over the BIKEPACKING.com Bikepacking 101 handbook"
authors = ["Adam Abuadas <adamabuadas@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
torch = "<2.3"
sentence-transformers = "<3.0"
numpy = "<2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
