[tool.poetry]
name = "bikepacking-rag"
version = "0.1.0"
description = "A learning-focused RAG pipeline over the BIKEPACKING.com Bikepacking 101 handbook"
authors = ["Adam Abuadas <adamabuadas@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
torch = "<2.3"
sentence-transformers = "<3.0"
numpy = "<2"
onnxruntime = "<1.19"
chromadb = "^1.5.9"
pysqlite3 = "^0.6.0"
python-dotenv = "<1.1"
google-generativeai = "^0.8.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.main]
# CI runs pylint without installing the heavy ML dependency stack
# (torch, chromadb, etc.), so it can't resolve these third-party imports.
disable = [
    "import-error",
    "missing-function-docstring",  # module-level docstrings cover intent here
]
